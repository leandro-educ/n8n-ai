name: n8n-local-panel-public-ia

services:
  postgres:
    image: postgres:17-alpine
    container_name: n8n_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10


  ollama:
    image: ollama/ollama:latest
    container_name: n8n_ollama
    restart: unless-stopped

    gpus: all

    ports:
      - "127.0.0.1:11434:11434"

    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "2m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      TZ: ${TZ}

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - backend
      - model_egress


  ollama_init:
    image: ollama/ollama:latest
    container_name: n8n_ollama_init
    restart: "no"

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Esperando que Ollama responda..."

        until ollama list >/dev/null 2>&1
        do
          sleep 2
        done

        echo "Descargando ${OLLAMA_MODEL}..."
        ollama pull "${OLLAMA_MODEL}"
        echo "Modelo ${OLLAMA_MODEL} listo."

    networks:
      - backend
      - model_egress


  n8n:
    image: ${N8N_IMAGE}
    container_name: n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: localhost
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678/

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"

      NODE_EXTRA_CA_CERTS: >-
        /opt/custom-certificates/ceres-rabbitmq-ca.crt

      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./certificates:/opt/custom-certificates

    ports:
      - "127.0.0.1:5678:5678"

    extra_hosts:
      - "ceres:192.168.100.50"

    networks:
      - app_net
      - backend


volumes:
  postgres_data:
  n8n_data:
  ollama_data:


networks:
  app_net:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  model_egress:
    driver: bridge


