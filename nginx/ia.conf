map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream react_backend {
    server react_app:80;
}

upstream n8n_backend {
    server n8n:5678;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # ------------------------------------------------------------
    # Webhooks PRODUCTIVOS de n8n.
    # Ejemplo:
    # https://ia.mysite.com.ar/webhook/generar-reporte
    # ------------------------------------------------------------
    location /webhook/ {
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Webhooks de PRUEBA mientras el nodo Webhook está "escuchando"
    # desde el editor local de n8n.
    # Si luego querés endurecer aún más el gateway, podés quitar
    # este bloque y trabajar sólo con workflows activados.
    # ------------------------------------------------------------
    location /webhook-test/ {
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------
    # Cualquier otra ruta pertenece a React.
    # El editor de n8n NO se enruta por este hostname.
    # ------------------------------------------------------------
    location / {
        proxy_pass http://react_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
